name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    # A test that stops ending must fail this job, not hold a runner for the six hours GitHub
    # allows by default. The same goes for `coverage`, which runs the same tests instrumented.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: "rustfmt, clippy, llvm-tools-preview"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p svd-gen -- --check
      # The model crates do no host I/O and must go on building for `wasm32-unknown-unknown`,
      # the target of the web version: nothing else would notice a host dependency slipping in.
      - name: Build the model for WebAssembly
        run: cargo check --target wasm32-unknown-unknown -p emu-core -p svd-regs -p cpu-rv32 -p soc-esp32c3
      - uses: EmbarkStudios/cargo-deny-action@v2
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0", components: "llvm-tools-preview" }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 80
  arch-test:
    # riscv-arch-test through RISCOF against Sail. On pushes to main it always runs. On PRs it is
    # skipped only when the diff provably touches nothing it depends on: any error computing the
    # diff runs the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect relevant changes
        id: scope
        run: |
          set -euo pipefail
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"; then
              if ! grep -qE '^(crates/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$|tools/conformance/|tools/docker/riscof/)' <<<"$changed"; then
                run=false
              fi
            else
              echo "git diff failed: running arch-test"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0" }
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.scope.outputs.run == 'true'
        run: tools/conformance/run-arch-test.sh
  rom-boot:
    # Boots the real ESP32-C3 mask ROM. The ROM is downloaded from Espressif's pinned release and
    # verified by inkemu itself; it is never stored in this repository. The cache below saves a
    # download and replaces no check: `rom fetch` re-hashes every file already present.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rom
          key: esp-rom-elfs-20260528
      - name: Fetch and verify the mask ROMs
        run: cargo run --release -p emu-cli -- rom fetch --all --rom-dir "$RUNNER_TEMP/rom"
      - name: Boot the ROM
        env:
          INKEMU_ROM_ELF_DIR: ${{ runner.temp }}/rom
        # Each command must run exactly the expected number of tests, all passing: a renamed or
        # un-ignored test would otherwise leave this job green with nothing proven.
        run: |
          tools/ci/run-ignored-tests.sh 18 --release -p soc-esp32c3 --test real_rom -- --ignored
          tools/ci/run-ignored-tests.sh 16 --release -p emu-cli --test run_cli -- --ignored --skip x4_boots_the_reference_firmware
  reference-boot:
    # Boots the reference firmware (stock ESP-IDF bootloader + hello_world) from the real mask ROM
    # and runs it through a whole life: the application, its countdown, the restart it asks for
    # and the second boot. The firmware is built here, inside the pinned ESP-IDF image, and
    # checked against pinned SHA-256 values; it is never stored in this repository. The cache
    # saves the build and replaces no check: the image is re-hashed on every run.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rom
          key: esp-rom-elfs-20260528
      - id: firmware
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reference-firmware
          key: reference-firmware-${{ hashFiles('tools/reference-firmware/**', 'tools/docker/esp-idf/Dockerfile', 'tools/conformance/versions.env') }}
      # The build pulls the pinned ESP-IDF image, which takes 12.5 GB of disk once extracted
      # (measured on a development host), and GitHub only guarantees 14 GB to a hosted Linux runner:
      # without room made first, the pull or the Rust build after it can run out of disk. The
      # directories removed are toolchains preinstalled on the runner image that this job never
      # uses (.NET, the Android SDK, Haskell, CodeQL); `df` before and after puts the gain in the
      # job log. Only needed when the firmware is not in the cache.
      - name: Free disk space for the ESP-IDF image
        if: steps.firmware.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the reference firmware
        if: steps.firmware.outputs.cache-hit != 'true'
        run: tools/reference-firmware/build.sh "$RUNNER_TEMP/reference-firmware"
      - name: Verify the reference image
        working-directory: ${{ runner.temp }}/reference-firmware
        run: sha256sum -c "$GITHUB_WORKSPACE/tools/reference-firmware/SHA256SUMS.output"
      - name: Fetch and verify the mask ROMs
        run: cargo run --release -p emu-cli -- rom fetch --all --rom-dir "$RUNNER_TEMP/rom"
      - name: Boot the reference firmware
        env:
          INKEMU_ROM_ELF_DIR: ${{ runner.temp }}/rom
          INKEMU_REF_FLASH: ${{ runner.temp }}/reference-firmware/flash_hello.bin
        # Exact test counts, as in rom-boot: see tools/ci/run-ignored-tests.sh.
        run: |
          tools/ci/run-ignored-tests.sh 7 --release -p soc-esp32c3 --test reference_boot -- --ignored
          tools/ci/run-ignored-tests.sh 2 --release -p emu-cli --test run_cli x4_boots_the_reference_firmware -- --ignored
