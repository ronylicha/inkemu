name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0", components: "rustfmt, clippy, llvm-tools-preview" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p svd-gen -- --check
      - uses: EmbarkStudios/cargo-deny-action@v2
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0", components: "llvm-tools-preview" }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 80
  arch-test:
    # riscv-arch-test through RISCOF against Sail. On pushes to main it always runs. On PRs it is
    # skipped only when the diff provably touches nothing it depends on: any error computing the
    # diff runs the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect relevant changes
        id: scope
        run: |
          set -euo pipefail
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"; then
              if ! grep -qE '^(crates/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$|tools/conformance/|tools/docker/riscof/)' <<<"$changed"; then
                run=false
              fi
            else
              echo "git diff failed: running arch-test"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0" }
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.scope.outputs.run == 'true'
        run: tools/conformance/run-arch-test.sh
