name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    # A test that stops ending must fail this job, not hold a runner for the six hours GitHub
    # allows by default. The same goes for `coverage`, which runs the same tests instrumented.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: "rustfmt, clippy, llvm-tools-preview"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Also fails when a path a clippy.toml bans names nothing: see tools/ci/clippy.sh.
      - run: tools/ci/clippy.sh --workspace --all-targets --all-features -- -D warnings
      # A doc comment that rustdoc reads wrongly (a bit range such as `[9:0]` taken for a link, a
      # link to an item the public documentation cannot reach) is a warning here: it fails the job.
      - name: Documentation without a warning
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo test --workspace
      - run: cargo run -p svd-gen -- --check
      # The model crates, the crates a front end composes a flash with, the one it replays a
      # session with and the one that compares the model with QEMU must go on building for
      # `wasm32-unknown-unknown`, the target of the web version: this step notices a crate that
      # does not build there. It cannot notice host I/O, which std compiles there and fails at run
      # time: the clippy step above refuses it in firmware, boards, soc-esp32c3, console-script,
      # session and lockstep (their clippy.toml).
      - name: Build the model for WebAssembly
        run: cargo check --target wasm32-unknown-unknown -p emu-core -p svd-regs -p cpu-rv32 -p soc-esp32c3 -p firmware -p boards -p console-script -p session -p lockstep
      - uses: EmbarkStudios/cargo-deny-action@v2
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0", components: "llvm-tools-preview" }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 80
  arch-test:
    # riscv-arch-test through RISCOF against Sail. On pushes to main it always runs. On PRs it is
    # skipped only when the diff provably touches nothing it depends on: any error computing the
    # diff runs the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect relevant changes
        id: scope
        run: |
          set -euo pipefail
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"; then
              if ! grep -qE '^(crates/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$|tools/conformance/|tools/docker/riscof/)' <<<"$changed"; then
                run=false
              fi
            else
              echo "git diff failed: running arch-test"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0" }
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.scope.outputs.run == 'true'
        run: tools/conformance/run-arch-test.sh
  rom-boot:
    # Boots the real ESP32-C3 mask ROM. The ROM is downloaded from Espressif's pinned release and
    # verified by inkemu itself; it is never stored in this repository. The cache below saves a
    # download and replaces no check: `rom fetch` re-hashes every file already present.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rom
          key: esp-rom-elfs-20260528
      - name: Fetch and verify the mask ROMs
        run: cargo run --release -p emu-cli -- rom fetch --all --rom-dir "$RUNNER_TEMP/rom"
      - name: Boot the ROM
        env:
          INKEMU_ROM_ELF_DIR: ${{ runner.temp }}/rom
        # Each command must run exactly the expected number of tests, all passing: a renamed or
        # un-ignored test would otherwise leave this job green with nothing proven. Every suite
        # runs even when one before it fails, so that one run shows every failure, and the step
        # fails at the end if any did.
        run: |
          failed=0
          tools/ci/run-ignored-tests.sh 19 --release -p soc-esp32c3 --test real_rom -- --ignored || failed=1
          tools/ci/run-ignored-tests.sh 28 --release -p emu-cli --test run_cli -- --ignored --skip reference_firmware || failed=1
          exit "$failed"
  reference-boot:
    # Boots the reference firmware (stock ESP-IDF bootloader + hello_world) from the real mask ROM
    # and runs it through a whole life: the application, its countdown, the restart it asks for
    # and the second boot; then the same application alone, behind the bootloader inkemu ships,
    # whose bytes a test compares with those of this build. A second example, nvs_rw_value_cxx,
    # keeps a restart counter in NVS: it is built next to the first, once under its own partition
    # table and once under the stock table of the X4. Three more read their consoles, typed into
    # by a console script: uart_select (UART0), usb_serial_jtag_echo and usb_serial_jtag_console
    # (USB-Serial-JTAG, the last one written for inkemu); they are applications, run behind the
    # bootloader inkemu ships. One more, adc_wait_panic, also written for inkemu, takes the path
    # that stops CrossPoint: a wait for the SAR ADC with interrupts masked, the panic of the
    # interrupt watchdog, a core dump in flash and a second life. The last one, deep_sleep_timer,
    # ours too, sleeps three times on the RTC timer and wakes as the chip does (rst:0x5), counting
    # its lives in RTC memory, then sleeps with no wake source. The firmware is built here,
    # inside the pinned ESP-IDF image, and checked against pinned SHA-256 values. The bootloader
    # is the one artefact of this build that is committed, under third_party/esp-idf-bootloader/;
    # the applications and the merged images are never stored in this repository. The cache
    # saves the build and replaces no check: the images are re-hashed on every run. Last, the
    # lockstep (ADR 0008) runs flash_hello.bin in Espressif's QEMU, inside the same pinned image,
    # and in inkemu, and compares the two after every instruction, one window per reference image
    # QEMU covers: through the reset esp_restart asks for, to the next one.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rom
          key: esp-rom-elfs-20260528
      - id: firmware
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reference-firmware
          key: reference-firmware-${{ hashFiles('tools/reference-firmware/**', 'tools/docker/esp-idf/Dockerfile', 'tools/conformance/versions.env', 'tests/fixtures/partitions/x4-stock.bin') }}
      # The pinned ESP-IDF image takes 12.5 GB of disk once extracted (measured on a development
      # host), and GitHub only guarantees 14 GB to a hosted Linux runner: without room made first,
      # the pull or the Rust build after it can run out of disk. The directories removed are
      # toolchains preinstalled on the runner image that this job never uses (.NET, the Android
      # SDK, Haskell, CodeQL); `df` before and after puts the gain in the job log. Needed on every
      # run: the build pulls the image when the firmware is not in the cache, and the lockstep
      # runs QEMU in it whatever the cache.
      - name: Free disk space for the ESP-IDF image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the reference firmware
        if: steps.firmware.outputs.cache-hit != 'true'
        run: tools/reference-firmware/build.sh "$RUNNER_TEMP/reference-firmware"
      - name: Verify the reference images
        working-directory: ${{ runner.temp }}/reference-firmware
        run: sha256sum -c "$GITHUB_WORKSPACE/tools/reference-firmware/SHA256SUMS.output"
      - name: Fetch and verify the mask ROMs
        run: cargo run --release -p emu-cli -- rom fetch --all --rom-dir "$RUNNER_TEMP/rom"
      - name: Boot the reference firmware
        env:
          INKEMU_ROM_ELF_DIR: ${{ runner.temp }}/rom
          INKEMU_REF_FLASH: ${{ runner.temp }}/reference-firmware/flash_hello.bin
          INKEMU_NVS_FLASH: ${{ runner.temp }}/reference-firmware/flash_nvs.bin
          INKEMU_NVS_OTA_FLASH: ${{ runner.temp }}/reference-firmware/flash_nvs_ota.bin
          INKEMU_UART_SELECT_APP: ${{ runner.temp }}/reference-firmware/uart_select.bin
          INKEMU_USJ_ECHO_APP: ${{ runner.temp }}/reference-firmware/usb_serial_jtag_echo.bin
          INKEMU_USJ_CONSOLE_APP: ${{ runner.temp }}/reference-firmware/usb_serial_jtag_console.bin
          INKEMU_ADC_WAIT_PANIC_APP: ${{ runner.temp }}/reference-firmware/adc_wait_panic.bin
          INKEMU_DEEP_SLEEP_TIMER_APP: ${{ runner.temp }}/reference-firmware/deep_sleep_timer.bin
        # Exact test counts, and every suite run whatever the one before it did, as in rom-boot:
        # see tools/ci/run-ignored-tests.sh.
        run: |
          failed=0
          tools/ci/run-ignored-tests.sh 13 --release -p soc-esp32c3 --test reference_boot -- --ignored || failed=1
          tools/ci/run-ignored-tests.sh 13 --release -p emu-cli --test run_cli reference_firmware -- --ignored || failed=1
          tools/ci/run-ignored-tests.sh 5 --release -p console-script --test reference_firmware -- --ignored || failed=1
          exit "$failed"
      # QEMU runs only inside the pinned image (decision H6), the same as the firmware's.
      - name: Pull the image QEMU runs in
        run: |
          source tools/conformance/versions.env
          docker pull --quiet "espressif/idf:$ESP_IDF_VERSION"
      # The lockstep (ADR 0008, docs/lockstep-differences.md), window hello: from the first
      # instruction of the ROM, through the bootloader, app_main and the countdown, through the
      # reset that esp_restart asks for, and through a second life to the next reset, without a
      # divergence outside the rows of the window. The number of compared instructions, the end
      # of the window and the uses of every row are pinned: a model change that adds or removes an
      # instruction, an admitted difference that grows into a divergence, or one that shows up
      # more or less often, fails here (exit 3). The tool prints what each row did, with the
      # largest move of each counter, and fails (exit 5) if a row, a register of a row or a bit of
      # its mask was not used, or a row was used outside what it declares (decision H3). About
      # three minutes of comparison.
      - name: Compare flash_hello.bin with QEMU after every instruction, through its reset
        timeout-minutes: 25
        run: |
          source tools/conformance/versions.env
          cargo run --release -p inkemu-lockstep -- --window hello \
            --flash "$RUNNER_TEMP/reference-firmware/flash_hello.bin" \
            --rom-dir "$RUNNER_TEMP/rom" \
            --image "espressif/idf:$ESP_IDF_VERSION" \
            --qemu "/opt/esp/tools/qemu-riscv32/$QEMU_ESP_BUILD/qemu/bin/qemu-system-riscv32" \
            --expect-compared 6813949 --expect-end reset \
            --expect-usage tools/ci/lockstep-hello.usage
      # Window nvs: nvs_rw_value_cxx writes its restart counter to NVS (programs and erases of
      # the flash through SPI1, in QEMU as in inkemu) before each esp_restart; through the first
      # reset to the second, pinned the same way.
      - name: Compare flash_nvs.bin with QEMU after every instruction, through its reset
        timeout-minutes: 25
        run: |
          source tools/conformance/versions.env
          cargo run --release -p inkemu-lockstep -- --window nvs \
            --flash "$RUNNER_TEMP/reference-firmware/flash_nvs.bin" \
            --rom-dir "$RUNNER_TEMP/rom" \
            --image "espressif/idf:$ESP_IDF_VERSION" \
            --qemu "/opt/esp/tools/qemu-riscv32/$QEMU_ESP_BUILD/qemu/bin/qemu-system-riscv32" \
            --expect-compared 7680555 --expect-end reset \
            --expect-usage tools/ci/lockstep-nvs.usage
      # The same run with a fault put in the CPU's state on purpose (bit 0 of t0 changed once a
      # million instructions are compared, a hook of the development binary only): the lockstep
      # must find it against the real QEMU, exit 1 and name the instruction. This proves the path
      # from a differing register to the report, nothing more: the next comparison sees the
      # changed register whatever the rows say. The step after puts a fault in a peripheral's
      # model, which only a row holds.
      - name: The lockstep finds a fault put in inkemu
        timeout-minutes: 10
        run: |
          source tools/conformance/versions.env
          set +e
          cargo run --release -p inkemu-lockstep -- --window hello \
            --flash "$RUNNER_TEMP/reference-firmware/flash_hello.bin" \
            --rom-dir "$RUNNER_TEMP/rom" \
            --image "espressif/idf:$ESP_IDF_VERSION" \
            --qemu "/opt/esp/tools/qemu-riscv32/$QEMU_ESP_BUILD/qemu/bin/qemu-system-riscv32" \
            --perturb-after 1000000 > "$RUNNER_TEMP/perturbed.txt" 2>&1
          code=$?
          set -e
          head -80 "$RUNNER_TEMP/perturbed.txt"
          test "$code" -eq 1 || { echo "exit $code where 1 (divergence) was expected"; exit 1; }
          grep -q "^divergence after 1000000 compared instructions" "$RUNNER_TEMP/perturbed.txt"
          grep -q "^instruction .* at 0x" "$RUNNER_TEMP/perturbed.txt"
          grep -q "^x5/t0 .*<<" "$RUNNER_TEMP/perturbed.txt"
      # A fault in a peripheral's model: once 2.5 million instructions are compared, the next read
      # of a SYSTIMER counter gives one count more in inkemu (a hook of the development binary
      # only). Row 15 admits that read, a gap moving down by one count, then holds the next read
      # of the counter to the gap the faulty read left: the gap moves up, which QEMU's truncating
      # counter never does, and the lockstep must report a divergence near row 15.
      - name: The lockstep finds a fault put in the SYSTIMER's model
        timeout-minutes: 10
        run: |
          source tools/conformance/versions.env
          set +e
          cargo run --release -p inkemu-lockstep -- --window hello \
            --flash "$RUNNER_TEMP/reference-firmware/flash_hello.bin" \
            --rom-dir "$RUNNER_TEMP/rom" \
            --image "espressif/idf:$ESP_IDF_VERSION" \
            --qemu "/opt/esp/tools/qemu-riscv32/$QEMU_ESP_BUILD/qemu/bin/qemu-system-riscv32" \
            --perturb-systimer-after 2500000 > "$RUNNER_TEMP/perturbed-systimer.txt" 2>&1
          code=$?
          set -e
          head -80 "$RUNNER_TEMP/perturbed-systimer.txt"
          test "$code" -eq 1 || { echo "exit $code where 1 (divergence) was expected"; exit 1; }
          grep -q "^divergence after 2500668 compared instructions" "$RUNNER_TEMP/perturbed-systimer.txt"
          grep -q "^nearest row of docs/lockstep-differences.md: 15 " "$RUNNER_TEMP/perturbed-systimer.txt"
      # The second life is compared, not only reached: the same fault as above, put four million
      # instructions in, after the reset (instruction 3 402 169), must be found there.
      - name: The lockstep finds a fault put in inkemu after the reset
        timeout-minutes: 15
        run: |
          source tools/conformance/versions.env
          set +e
          cargo run --release -p inkemu-lockstep -- --window hello \
            --flash "$RUNNER_TEMP/reference-firmware/flash_hello.bin" \
            --rom-dir "$RUNNER_TEMP/rom" \
            --image "espressif/idf:$ESP_IDF_VERSION" \
            --qemu "/opt/esp/tools/qemu-riscv32/$QEMU_ESP_BUILD/qemu/bin/qemu-system-riscv32" \
            --perturb-after 4000000 > "$RUNNER_TEMP/perturbed-after-reset.txt" 2>&1
          code=$?
          set -e
          head -80 "$RUNNER_TEMP/perturbed-after-reset.txt"
          test "$code" -eq 1 || { echo "exit $code where 1 (divergence) was expected"; exit 1; }
          grep -q "^divergence after 4000000 compared instructions" "$RUNNER_TEMP/perturbed-after-reset.txt"
          grep -q "^x5/t0 .*<<" "$RUNNER_TEMP/perturbed-after-reset.txt"
          grep -q "^resets crossed: 1$" "$RUNNER_TEMP/perturbed-after-reset.txt"
