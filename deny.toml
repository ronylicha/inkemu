[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[[licenses.exceptions]]
# Mozilla's root certificate list: data under a permissive data licence, used only to verify TLS when downloading the ROM.
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"
