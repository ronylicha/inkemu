[package]
name = "emu-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "inkemu"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
emu-core.workspace = true
cpu-rv32.workspace = true
firmware.workspace = true
clap.workspace = true
ctrlc.workspace = true
goblin.workspace = true
thiserror.workspace = true
soc-esp32c3.workspace = true
boards.workspace = true
sha2.workspace = true
ureq.workspace = true
flate2.workspace = true
tar.workspace = true
etcetera.workspace = true

# `poll`, to learn that the reader of standard output went away while a run prints nothing.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# `mkfifo`, for the tests of what an open does when a pipe sits at the name of a file.
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile = "3"
svd-regs.workspace = true
cpu-rv32 = { workspace = true, features = ["test-support"] }
soc-esp32c3 = { workspace = true, features = ["test-support"] }
firmware = { workspace = true, features = ["test-support"] }
