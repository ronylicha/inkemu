# Xteink X4. Hardware facts and their sources: docs/research/xteink-hardware.md.
id = "x4"
name = "Xteink X4"
# The console `inkemu run` shows when --console is not given. The USB-C port of the X4 is the
# USB-Serial-JTAG of the chip: the ROM and the bootloader mirror their lines there, and CrossPoint
# writes its own log there only (docs/research/flash-writes-and-crosspoint-boot.md, section K.2).
console = "usb-serial-jtag"

[soc]
family = "esp32c3"
# ASSUMPTION: the silicon revision of retail units is not established. v0.3 is the most common
# ESP32-C3 revision and selects the rev3 mask ROM. The chip revision a retail unit reports settles
# it: `esptool.py chip_id`, or the "chip revision" line of its boot log.
revision = "v0.3"

[flash]
# 16 MB: docs/research/xteink-hardware.md.
size_mib = 16
# ASSUMPTION: the flash part of retail units is not established. 0x9D6018 (manufacturer 0x9D, type
# 0x60, capacity 2^24 bytes) is the id the flash of Espressif's QEMU answers, so the 2nd-stage
# bootloader takes the vendor branch the reference traces were measured on
# (docs/research/esp32c3-bootloader-accesses.md, section 2.1 item 5). `esptool.py flash_id` on a
# unit settles it.
jedec_id = 0x9D6018

# The partition table the device boots with: `inkemu run --firmware` writes it at 0x8000 and puts
# the application in the slot the bootloader starts on a blank otadata (the factory application,
# else ota_0). The stock table of the X4, compiled byte for byte as
# tests/fixtures/partitions/x4-stock.bin; CrossPoint's partitions.csv is the same table
# (docs/research/flash-writes-and-crosspoint-boot.md, section J). Offsets and sizes are those of
# real X4 units: the flashers detect an X4 by them (docs/research/xteink-hardware.md, section 3.2).
# ASSUMPTION: the names, the flags and the MD5 entry of the X4 table are not established. They come
# from tables written for the X4 by third parties (CrossPoint's partitions.csv, Trusty's, the
# sample's default_16MB.csv, Sticky's compiled table), not from a dump of a retail unit, and the
# flashers compare only type, subtype, offset and size. A dump of the first 0x9000 bytes of a
# retail unit settles it.
[[partition]]
name = "nvs"
type = "data"
subtype = "nvs"
offset = 0x9000
size = 0x5000

[[partition]]
name = "otadata"
type = "data"
subtype = "ota"
offset = 0xE000
size = 0x2000

[[partition]]
name = "app0"
type = "app"
subtype = "ota_0"
offset = 0x10000
size = 0x640000

[[partition]]
name = "app1"
type = "app"
subtype = "ota_1"
offset = 0x650000
size = 0x640000

[[partition]]
name = "spiffs"
type = "data"
subtype = "spiffs"
offset = 0xC90000
size = 0x360000

[[partition]]
name = "coredump"
type = "data"
subtype = "coredump"
offset = 0xFF0000
size = 0x10000

# The chips around the SoC and the keys of the user: docs/research/sp2d-x4-wiring.md, section 2
# (pins, polarities, from FreeInk and CrossPoint's sources). The design of sub-project 2d, 2d-D15.
[wiring.display]
controller = "ssd1677"
config = "gdeq0426t82"
sclk = 8
mosi = 10
cs = 21
dc = 4
rst = 5
busy = 6
# Clockwise: the controller scans 800 × 480 and the firmware draws portrait, x' = y, y' = 479 - x
# (CrossPoint's GfxRenderer, section 1 item 7 of the research).
rotation = 90

# The ladders: idle at the 3.3 V rail; each level is the voltage ESP-IDF's calibration curve gives,
# at 12 dB on the X4's eFuse, to the code FreeInk records as the average of three devices
# (InputManager.cpp:29-44, section 3 of the research): Back 3512, Confirm 2694, Left 1493,
# Right 5; Up 2242, Down 5. The SoC's ADC converts each level back to that code within one
# (crates/boards/src/wired tests). The front keys, left to right, as CrossPoint's
# ButtonRemapActivity.cpp:140 orders them.
[[wiring.ladder]]
pin = 1
idle_mv = 3300
buttons = [
  { id = "back", mv = 2448, edge = "bottom", order = 0 },
  { id = "confirm", mv = 1896, edge = "bottom", order = 1 },
  { id = "left", mv = 1061, edge = "bottom", order = 2 },
  { id = "right", mv = 4, edge = "bottom", order = 3 },
]

[[wiring.ladder]]
pin = 2
idle_mv = 3300
buttons = [
  { id = "up", mv = 1584, edge = "right", order = 0 },
  { id = "down", mv = 4, edge = "right", order = 1 },
]

# Low while pressed; released, the pad's pull-up (CrossPoint configures INPUT_PULLUP).
[wiring.button.power]
pin = 3
active = "low"
edge = "top"
order = 0

# Two 10 kΩ resistors: the pin reads half the cell.
# ASSUMPTION: the cell's voltage, a charged cell between FreeInk's 4.2 V full and 3.45 V empty.
[wiring.battery]
pin = 0
top_ohms = 10000
bottom_ohms = 10000
cell_mv = 3900

# The latch holds the battery rail while released or high, cuts it low; GPIO20 reads high while a
# cable powers the X4 (section 1 items 8 and 9).
[wiring.power]
latch = 13
usb_detect = 20

# The SD card shares the display's SCLK and MOSI (section 1 item 1).
[wiring.sd]
cs = 12
miso = 7

# On battery the X4 starts only while its power key is held, and CrossPoint checks it still is.
# ASSUMPTION: how long a user holds it. CrossPoint verifies 10 ms; the stock firmware 3.0.2 holds
# its latch only after about a second of device time (measured 2026-10-15 on the model: a hold of
# 1000 ms lets the X4 go off when the key is let go, 1200 ms keeps it on), so a user holds it
# longer than that.
[power]
key = "power"
hold_ms = 1500
