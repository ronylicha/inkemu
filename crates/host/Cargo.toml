[package]
name = "host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The host policy of inkemu's front ends: the files a run reads and writes, the ROM, the sessions, the
# loop that runs a machine, and a machine on a thread of its own with its commands and its ports. The
# command line and the desktop application both consume it (design SP2c, C1).
[lints]
workspace = true

[features]
# `host::test_support`: a device for the tests of a front end (the Tauri shell). Never in a release.
test-support = ["soc-esp32c3/test-support"]

[dependencies]
emu-core.workspace = true
chips.workspace = true
firmware.workspace = true
soc-esp32c3.workspace = true
boards.workspace = true
console-script.workspace = true
session.workspace = true
serde.workspace = true
thiserror.workspace = true
sha2.workspace = true
ureq.workspace = true
flate2.workspace = true
tar.workspace = true
etcetera.workspace = true

# `O_NOFOLLOW` and `O_NONBLOCK`, to open the flash file without following a link or blocking on a pipe.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# `mkfifo`, for the tests of what an open does when a pipe sits at the name of a file.
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
# Reads back the FAT32 images `sd_format` makes: another implementation than ours. A test
# dependency only; its last release is from January 2023 (design SP2e, 2e-D15).
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
# Reads the manifests of the repository: `test-support` stays out of every normal build.
toml.workspace = true
# The shape the interface reads the updates in.
serde_json = "1"
svd-regs.workspace = true
cpu-rv32 = { workspace = true, features = ["test-support"] }
soc-esp32c3 = { workspace = true, features = ["test-support"] }
firmware = { workspace = true, features = ["test-support"] }
