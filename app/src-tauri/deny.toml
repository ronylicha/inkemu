# cargo-deny for the Tauri shell, a Cargo workspace of its own (design of sub-project 2c, C17). The
# rules of the root deny.toml, word for word, with exactly three differences, each for the shell's
# dependency tree (Tauri, WebKitGTK, GTK 3) and with its reason below: MPL-2.0 among the licences,
# `allow-wildcard-paths` (its path dependencies on the repository's crates), and one advisory
# ignored. The CI runs it in the job `app`.

[graph]
all-features = true

[licenses]
# MPL-2.0 is file-level copyleft: cssparser, cssparser-macros, selectors and dtoa-short (Servo's CSS
# parsing, which Tauri's HTML tooling pulls in at build time) and option-ext (through `dirs`) are used
# unmodified; a binary that ships them carries their notices and says where their source is, which
# the application bundle of sub-project 9 does.
# The root's list plus MPL-2.0; BSD-2-Clause, which no crate of the shell uses today, stays allowed
# as at the root (cargo-deny says so with a warning).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[[licenses.exceptions]]
# Mozilla's root certificate list: data under a permissive data licence, used only to verify TLS when downloading the ROM.
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The shell is never published: its path dependencies on the crates of the repository are not wildcards
# anyone can resolve elsewhere.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error, unmaintained: a build-time dependency of glib-macros and gtk3-macros 0.18, the
    # GTK 3 bindings every Tauri 2 release uses on Linux. No Tauri 2 release leaves them; the heir is
    # named in docs/superpowers/notes/2026-10-15-sp2c-carryover.md (sub-project 9 follows Tauri).
    { id = "RUSTSEC-2024-0370", reason = "build-time macro helper of the GTK 3 bindings of Tauri 2; no release leaves it" },
]
# Read on 2026-10-15, and not ignored since cargo-deny does not raise them: the GTK 3 "unmaintained"
# advisories (RUSTSEC-2024-0411 to 0420) were withdrawn on 2026-08-14; RUSTSEC-2024-0429, the unsound
# `VariantStrIter` of glib 0.18 (fixed in 0.20, which no Tauri 2 release uses), names functions that
# nothing in the shell's tree calls (only glib itself names the type). Should a future database raise
# it, the job fails and this reasoning is checked again rather than assumed.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
